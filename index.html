<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Bar</title>
<style>
  :root { --bg:#14181f; --bar:#222936; --text:#e8ecf2; --accent:#4da3ff; --muted:#8793a6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  form { display: flex; gap: 12px; width: 100%; max-width: 900px; }
  input {
    flex: 1; min-width: 0; font-size: 1.4rem; padding: 18px 22px;
    background: var(--bar); color: var(--text);
    border: 2px solid transparent; border-radius: 12px; outline: none;
  }
  input::placeholder { color: var(--muted); }
  input:focus, button:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(77,163,255,.35); }
  button {
    font-size: 1.4rem; padding: 0 28px; border: 2px solid transparent; border-radius: 12px;
    background: var(--accent); color: #06121f; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <form id="f">
    <input id="u" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="Enter a URL, e.g. https://example.com" autofocus>
    <button type="submit">Go</button>
  </form>

<script>
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var url = document.getElementById('u').value.trim();
    if (!url) return;
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) url = 'https://' + url;
    location.href = url;
  });
</script>
</body>
</html>
